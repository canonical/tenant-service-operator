name: tenant-service
type: charm
title: Tenant Service Operator
summary: Operator for Identity platform Tenant Service
description: |
    Operator for Identity platform Tenant Service
links:
  source: https://github.com/canonical/tenant-service-operator
  issues: https://github.com/canonical/tenant-service-operator/issues

charm-user: non-root
platforms:
  ubuntu@22.04:amd64:

assumes:
  - juju >= 3.0.2
  - k8s-api

config:
  options:
    http_proxy:
      description: URL of the HTTP proxy eg http://proxy.internal:6666, it will set the HTTP_PROXY var in the workload environment
      type: string
      default: ''
    https_proxy:
      description: URL of the HTTPS proxy eg http://proxy.internal:6666, it will set the HTTPS_PROXY var in the workload environment
      type: string
      default: ''
    no_proxy:
      description: Domains that need to be excluded from proxying no_proxy="test.com,test.co.uk", it is a comma separate list
      type: string
      default: ''
    log_level:
      description: |
        Configures the log level.

        Acceptable values are: "info", "debug", "warning", "error" and "critical"
      default: "info"
      type: string
    cpu:
      description: |
        K8s cpu resource limit, e.g. "1" or "500m". Default is unset (no limit). This value is used
        for the "limits" portion of the resource requirements (the "requests" portion is
        automatically deduced from it).
        See https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
      type: string
    memory:
      description: |
        K8s memory resource limit, e.g. "1Gi". Default is unset (no limit). This value is used
        for the "limits" portion of the resource requirements (the "requests" portion is
        automatically deduced from it).
        See https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
      type: string
    authorization_enabled:
      description: |
        Whether the access control authorization integration is enabled.
      type: boolean
      default: true
    invitation_lifetime:
      description: |
        Duration an invitation/recovery link remains valid. E.g. "24h", "48h".
      type: string
      default: '24h'
    authn_allowed_subjects:
      description: |
        Comma separated list of allowed subject IDs that are allowed to access the Group/Authz management APIs.
      type: string
      default: ''
    authn_allowed_scope:
      description: |
        The allowed OAuth2 scopes that are allowed to access the Group/Authz management APIs.
      type: string
      default: ''
    authn_issuer:
      description: |
        The expected issuer of incoming tokens to the Group/Authz management APIs.

        This configuration cannot be used with when the oauth integration exists.
      type: string
      default: ''
    authn_jwks_url:
      description: |
        The URL to fetch JWKS keys for validating incoming tokens to the Group/Authz management APIs.

        This configuration cannot be used with when the oauth integration exists.
      type: string
      default: ''

actions:
  get-access-token:
    description: |
      Generate a JWT token for accessing the tenant management APIs.

      This action requires the oauth integration to be established and ready.
  create-tenant:
    description: Create a new tenant.
    params:
      name:
        type: string
        description: Name of the tenant to create.
    required: [name]
  list-tenants:
    description: List all tenants.
    params:
      page-size:
        type: integer
        description: Maximum number of results to return per page.
      page-token:
        type: string
        description: Token to retrieve the next page of results.
  delete-tenant:
    description: Delete a tenant.
    params:
      tenant-id:
        type: string
        description: ID of the tenant to delete.
    required: [tenant-id]
  activate-tenant:
    description: Enable a disabled tenant.
    params:
      tenant-id:
        type: string
        description: ID of the tenant to activate.
    required: [tenant-id]
  deactivate-tenant:
    description: Disable an active tenant.
    params:
      tenant-id:
        type: string
        description: ID of the tenant to deactivate.
    required: [tenant-id]
  update-tenant:
    description: Update a tenant's name.
    params:
      tenant-id:
        type: string
        description: ID of the tenant to update.
      name:
        type: string
        description: New name for the tenant.
    required: [tenant-id, name]
  list-tenant-users:
    description: List all users in a tenant.
    params:
      tenant-id:
        type: string
        description: ID of the tenant.
      page-size:
        type: integer
        description: Maximum number of results to return per page.
      page-token:
        type: string
        description: Token to retrieve the next page of results.
    required: [tenant-id]
  invite-user:
    description: Send an invitation email to join a tenant.
    params:
      tenant-id:
        type: string
        description: ID of the tenant.
      email:
        type: string
        description: Email address of the user to invite.
      role:
        type: string
        description: Role to assign (e.g. admin, member).
    required: [tenant-id, email, role]
  provision-user:
    description: Directly add a user to a tenant without an invitation flow.
    params:
      tenant-id:
        type: string
        description: ID of the tenant.
      email:
        type: string
        description: Email address of the user to provision.
      role:
        type: string
        description: Role to assign (e.g. admin, member).
    required: [tenant-id, email, role]
  update-user-role:
    description: Update a user's role within a tenant.
    params:
      tenant-id:
        type: string
        description: ID of the tenant.
      user-id:
        type: string
        description: ID of the user.
      role:
        type: string
        description: New role for the user.
    required: [tenant-id, user-id, role]

requires:
  logging:
    interface: loki_push_api
    optional: true
  tracing:
    interface: tracing
    limit: 1
    optional: true
    description: |
      Provides traces to COS Tempo instance
  internal-route:
    interface: traefik_route
    limit: 1
    optional: true
    description: |
      Allows the charm to be exposed for cross-cluster communication, needed
      for cases where network topology is more complex than just one k8s cluster
  pg-database:
    interface: postgresql_client
    optional: false
    limit: 1
  openfga:
    interface: openfga
    limit: 1
    description: |
      Receive OpenFGA server's url and store information.
  kratos-info:
    interface: kratos_info
    limit: 1
    optional: false
    description: |
      Receive Kratos deployment info including the admin endpoint URL.
  oauth:
    interface: oauth
    limit: 1
    description: |
      Receive oauth server's info and a set of client credentials.
      This integration can be used to integrate the service with an OAuth2/OIDC Provider.
  receive-ca-cert:
    interface: certificate_transfer
    description: |
      Receive a CA cert.
      This relation can be used with a local CA to obtain the CA cert that was used to sign proxied
      endpoints.

provides:
  metrics-endpoint:
    interface: prometheus_scrape
    optional: true
    description: |
      Provides application metrics to COS Prometheus instance
  grafana-dashboard:
    interface: grafana_dashboard
    optional: true
    description: |
      Forwards the built-in grafana dashboard(s) for monitoring tenant-service.
  hydra-token-hook:
    interface: hydra_token_hook
    optional: true
    description: |
      Register a token enrichment webhook with Hydra to inject tenant_id claims
      into access and ID tokens.
  kratos-registration-webhook:
    interface: kratos_registration_webhook
    optional: true
    description: |
      Register a registration webhook with Kratos for tenant auto-creation
      on user registration.
  kratos-login-webhook:
    interface: kratos_login_webhook
    optional: true
    description: |
      Register a login validation webhook with Kratos to verify tenant
      membership and perform lazy identity reconciliation during login.
  tenant-service-info:
    interface: tenant_service_info
    optional: true
    description: |
      Provides the tenant-service HTTP API URL to a related application.

peers:
  tenant-service:
    interface: tenant_service_peers

containers:
  tenant-service:
    gid: 584792
    uid: 584792
    resource: oci-image

resources:
  oci-image:
    type: oci-image
    description: OCI image for tenant-service
    upstream-source: ghcr.io/canonical/tenant-service:v0.2.0

parts:
  charm:
    charm-binary-python-packages:
      - jsonschema
      - "pydantic>=2"
      - "setuptools>=70.0.0"
    build-packages:
      - "rustc-1.85"
      - "cargo-1.85"
